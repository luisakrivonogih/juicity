# Umbra fork: release the server and client for the Umbra panel's deploy
# scripts, in upstream's archive layout. Tags look like umbra-v0.5.0-1.
name: Umbra release

on:
  push:
    tags:
      - umbra-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./server/... ./config/...
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            name=$arch; [ "$arch" = amd64 ] && name=x86_64
            mkdir -p "build-$arch"
            for bin in server client; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X github.com/juicity/juicity/config.Version=${GITHUB_REF_NAME}" \
                -o "build-$arch/juicity-$bin" ./cmd/$bin
            done
            (cd "build-$arch" && zip -q "../dist/juicity-linux-$name.zip" juicity-server juicity-client)
          done
          (cd dist && sha256sum *.zip > sha256sums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
